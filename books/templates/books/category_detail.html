{% extends 'books/base.html' %}

{% block content %}

<div class="container py-4">
    <a href="{% url 'books:home' %}" class="btn btn-outline-secondary mb-3">
        ← На головну
    </a>
    <h1 class="mb-4">{{ category.name }}</h1>
    <div class="row g-4">
        {% for book in books %}
            <div class="col-md-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title">
                            <a href="{% url 'books:book_detail' book.id %}"
                               class="text-decoration-none">
                                {{ book.title }}
                            </a>
                        </h4>
                        <p class="text-muted">{{ book.author }}</p>
                        <p>{{ book.description }}</p>
                        <strong>{{ book.price }} грн</strong>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>У цій категорії поки немає книг.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
