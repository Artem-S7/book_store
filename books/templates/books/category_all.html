<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Всі категорії </title>
</head>
<body>
<h1>Всі категорії</h1>

    <h2> {{ category.name }} </h2>

    {% for book in category.book_set.all %}

    {% endfor %}

{% endfor %}
</body>
</html>
